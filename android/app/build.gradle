plugins {
    id 'com.android.application'
}

android {
    namespace 'mx.vicentemack.timervoz'
    compileSdk 34

    defaultConfig {
        applicationId 'mx.vicentemack.timervoz'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    // Firma fija para que cada version nueva se instale encima de la anterior.
    // La llave y su clave NO estan en el repositorio: antes de compilar, GitHub las saca
    // del secreto FIRMA_APP_P12 (ver .github/workflows/android.yml), deja la llave en
    // app/firma.p12 y la clave en la variable FIRMA_CLAVE. Sin ellas, la app sale sin firma.
    def llave = file('firma.p12')
    def clave = System.getenv('FIRMA_CLAVE') ?: ''
    signingConfigs {
        firma {
            storeFile llave
            storeType 'pkcs12'
            storePassword clave
            keyAlias 'timervoz'
            keyPassword clave
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (llave.exists() && clave) signingConfig signingConfigs.firma
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
