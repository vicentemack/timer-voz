name: App Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Llave de firma (secreto FIRMA_APP_P12)
        env:
          FIRMA_APP_P12: ${{ secrets.FIRMA_APP_P12 }}
        run: |
          if [ -z "$FIRMA_APP_P12" ]; then
            echo "::error::Falta el secreto FIRMA_APP_P12 (la llave de la app). Sin el no se compila ni se publica nada."
            exit 1
          fi
          SECRETO=$(printf '%s' "$FIRMA_APP_P12" | tr -d ' \r\n')
          CLAVE="${SECRETO%%:*}"
          echo "::add-mask::$CLAVE"
          printf '%s' "${SECRETO#*:}" | base64 -d > android/app/firma.p12
          echo "FIRMA_CLAVE=$CLAVE" >> "$GITHUB_ENV"
          ls -l android/app/firma.p12

      - name: Compilar la app
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../compilacion.log

      - name: Errores (si fallo)
        if: failure()
        run: |
          grep -nE "error:|e: |What went wrong|FAILED|Exception" compilacion.log | head -30 | while IFS= read -r l; do echo "::error::${l}"; done

      - name: Revisar la firma
        run: |
          AS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          echo "== Firma de la app ==" | tee -a compilacion.log
          "$AS" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk 2>&1 | tee -a compilacion.log

      - name: Publicar la app
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 -o "versionName '[0-9.]*'" android/app/build.gradle | grep -o "[0-9.]*" | tr '.' '_')
          cp android/app/build/outputs/apk/release/app-release.apk PRS_Timer_Voz_App.apk
          cp android/app/build/outputs/apk/release/app-release.apk "PRS_Timer_Voz_App_v${VERSION}.apk"
          gh release delete app-android --yes --cleanup-tag || true
          gh release create app-android PRS_Timer_Voz_App.apk "PRS_Timer_Voz_App_v${VERSION}.apk" --target "$GITHUB_SHA" --title "App PRS Timer Voz (Android) v${VERSION}" --notes "Compilada del commit ${GITHUB_SHA::7}." --latest=false

      - name: Borrar la llave del servidor
        if: always()
        run: rm -f android/app/firma.p12

      - name: Guardar el registro
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view registro-android > /dev/null 2>&1 || gh release create registro-android --target "$GITHUB_SHA" --title "Registro de compilacion (Android)" --notes "Ultimo registro de la compilacion de la app." --prerelease --latest=false
          gh release upload registro-android compilacion.log --clobber
